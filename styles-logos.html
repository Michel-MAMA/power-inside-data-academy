/* ────────────────────────────────────────────────────────
   TECH LOGO BADGE SYSTEM — Premium
   ──────────────────────────────────────────────────────── */

:root {
  /* Logo dimensions */
  --logo-size-sm: 16px;
  --logo-size-md: 20px;
  --logo-size-lg: 24px;
  --logo-size-xl: 32px;

  /* Badge padding */
  --badge-gap: 8px;
  --badge-padding: 6px 10px;
  --badge-padding-lg: 8px 14px;
}

/* ── BASE LOGO CLASS ── */
.tech-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--logo-size-md);
  height: var(--logo-size-md);
  flex-shrink: 0;
  transition: transform .2s;
}

.tech-logo:hover {
  transform: scale(1.1);
}

/* ── BADGE WITH LOGO ── */
.tech-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--badge-gap);
  padding: var(--badge-padding);
  border-radius: 8px;
  border: 1px solid rgba(0,0,0,.08);
  background: var(--s2);
  font-size: 11px;
  font-weight: 600;
  color: var(--w85);
  transition: all .2s;
  white-space: nowrap;
}

.tech-badge:hover {
  border-color: rgba(0,0,0,.12);
  background: var(--s3);
  transform: translateY(-1px);
}

.tech-badge.premium {
  background: var(--s1);
  border-color: var(--bdr);
}

/* ── SIZE VARIANTS ── */
.tech-logo-sm { --logo-size-md: 16px; }
.tech-logo-md { --logo-size-md: 20px; }
.tech-logo-lg { --logo-size-md: 24px; }
.tech-logo-xl { --logo-size-md: 32px; }

.tech-badge-sm {
  padding: 4px 8px;
  font-size: 10px;
  gap: 6px;
}

.tech-badge-lg {
  padding: var(--badge-padding-lg);
  font-size: 12px;
  gap: 10px;
}

/* ── LOGOS INLINE IN TEXT ── */
.logo-inline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  color: var(--white);
}

.logo-inline .tech-logo {
  --logo-size-md: 18px;
}

/* ── TECHNOLOGY ROWS ── */
.tech-row {
