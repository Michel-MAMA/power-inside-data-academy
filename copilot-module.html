<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Module | Power Inside Data Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/material-darker.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #fff; color: #111; font-family: 'Inter', sans-serif; overflow-x: hidden; }

    :root {
      --blue: #00A4EF;
      --blue-light: #E5F7FF;
      --black: #111111;
      --gray: #666666;
      --gray-mid: #999999;
      --gray-light: #E8E8E8;

      --red: #FF4757;
      --radius: 6px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);

    body { background: var(--bg); color: var(--black); font-family: 'Inter', sans-serif; }
    a { color: var(--blue); text-decoration: none; }

    nav { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid var(--gray-light); padding: 0 24px; }
    .nav-inner { max-width: var(--max); margin: 0 auto; display: flex; align-items: center; gap: 40px; height: 60px; }
    .nav-logo { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; color: var(--black); flex-shrink: 0; }
    .nav-logo span { color: var(--blue); }
    .nav-breadcrumb { display: flex; align-items: center; gap: 12px; flex: 1; font-size: 13px; color: var(--gray); }
    .nav-breadcrumb a { color: var(--blue); font-weight: 600; }
    .nav-cta { display: flex; gap: 10px; margin-left: auto; }
    .nav-cta a { padding: 8px 18px; background: var(--blue); color: #fff; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }

    .hero { padding: 40px 24px; background: linear-gradient(135deg, var(--blue-light), #fff); text-align: center; }
    .hero-inner { max-width: var(--max); margin: 0 auto; }
    .hero h1 { font-size: clamp(28px, 3vw, 42px); font-weight: 800; margin-bottom: 12px; font-family: 'Plus Jakarta Sans', sans-serif; }
    .hero p { font-size: 15px; color: var(--gray); max-width: 700px; margin: 0 auto; line-height: 1.6; }

    .section { padding: 60px 24px; }
    .section-inner { max-width: var(--max); margin: 0 auto; }

    .module { margin-bottom: 48px; padding: 32px; background: var(--blue-light); border-radius: 12px; border-left: 4px solid var(--blue); }
    .module-title { font-size: 20px; font-weight: 700; color: var(--black); margin-bottom: 12px; font-family: 'Plus Jakarta Sans', sans-serif; }
    .module-desc { color: var(--gray); font-size: 14px; line-height: 1.7; margin-bottom: 24px; }

    .sandbox-container { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 24px; }

    .sandbox-editor { display: flex; flex-direction: column; gap: 8px; }
    .sandbox-label { font-size: 12px; font-weight: 600; color: var(--gray-mid); text-transform: uppercase; letter-spacing: 0.05em; }
    .editor-container { height: 250px; border: 1px solid var(--gray-light); border-radius: 8px; overflow: hidden; }
    .CodeMirror { height: 100% !important; font-family: 'Courier New', monospace !important; font-size: 13px !important; }

    .concepts-box { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--blue); }
    .concepts-box strong { display: block; margin-bottom: 12px; }
    .concepts-box ul { margin-left: 20px; margin-top: 8px; }
    .concepts-box li { margin-bottom: 6px; }

    .takeaway-box { background: var(--blue-light); padding: 16px; border-radius: 8px; margin-top: 16px; border-left: 4px solid var(--blue); }
    .takeaway-box strong { display: block; margin-bottom: 8px; }
    .takeaway-box p { margin-top: 8px; font-size: 14px; line-height: 1.6; }

    .module-nav { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--gray-light); }
    .nav-button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; font-size: 14px; }
    .nav-button:hover:not(:disabled) { background: #0089BD; transform: translateY(-2px); }
    .nav-button:disabled { background: var(--gray-light); color: var(--gray-mid); cursor: not-allowed; }
    .nav-progress { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gray-mid); font-weight: 600; }
    .progress-bar { width: 100px; height: 4px; background: var(--gray-light); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--blue); border-radius: 2px; }

    footer { padding: 40px 24px; background: var(--gray-light); text-align: center; border-top: 1px solid #ddd; }
    footer p { font-size: 13px; color: var(--gray); }
    footer a { color: var(--blue); font-weight: 600; }

    .loader { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(0, 0, 0, 0.1); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media(max-width: 768px) {
      nav { padding: 0 16px; }
      .nav-inner { gap: 12px; }
      .nav-breadcrumb { display: none; }
      .section { padding: 40px 16px; }
      .module { padding: 20px; }
      .module-nav { flex-wrap: wrap; }
      .nav-progress { width: 100%; order: -1; }
    }
  </style>
</head>

  2: {
    title: 'Création d\'Agents Conversationnels',
    desc: 'Concevoir et entraîner agents conversationnels efficaces',
    concepts: [
      'Agent Design: Scope, tone, knowledge domain',
      'Topics & Triggers: Structure conversations',
      'Entities: Extraire informations (nom, email, date)',
      'Actions: Appeler APIs, mettre à jour données',
      'Fallback Handling: Gérer requests inattendues',
      'Testing & Iteration: Améliorer performance'
    ],
    code: `<!-- Création d'un Agent Conversationnel -->

Agent Configuration:
{
  "name": "HR Support Agent",
  "description": "Aide pour demandes ressources humaines",
  "personality": "Professionnel, amical, rapide",
  "systemPrompt": "Vous êtes assistant HR...",
  "language": "Français",
  "timezone": "Europe/Paris"

Topics Structure:

├── Leave Requests

Conversation Flow Example:

  3: {

    desc: 'Connecter agents à APIs et sources données',
    concepts: [
      'Power Automate Flows: Automatisation workflows',
      'API Plugins: Intégration REST/SOAP APIs',
      'Authentication: OAuth, API Keys, Managed Identity',
      'Data Connectors: SharePoint, SQL, Dataverse',
      'Error Handling: Retry logic, timeouts',
      'Rate Limiting: Gérer quotas APIs'
    ],
    code: `<!-- Intégration APIs dans Copilot Studio -->
<!-- Connecter à données et systèmes externes -->

{

      "checks": ["date_validity", "balance_check"]

      "name": "CreateRecord",

Connecteurs disponibles:

- SharePoint: Document storage
- SQL Server: Databases

- Office 365: Email, Calendar
- Teams: Messages, posts
- Custom APIs: REST endpoints

Exemple d'intégration REST:
POST /api/leave-requests
Headers:

  Content-Type: application/json

Body:
{
  "employeeId": "E001",
  "leaveType": "ANNUAL",
  "startDate": "2024-07-15",

{

  "status": "PENDING",
  "approvalDeadline": "2024-06-15"

Sécurité & Authentification:
✓ OAuth 2.0: Secure token exchange
✓ API Keys: Managed securely
✓ Managed Identity: Azure AD integration
✓ Encryption: Data in transit & rest
✓ Audit: Tous les appels loggés
`,
    takeaway: 'APIs = extension capabilities. Power Automate = glue entre agents et systèmes. Auth = non-negotiable. Error handling = robustesse. Audit trail = compliance!'
  },

  4: {
    title: 'Déploiement & Monitoring',
    desc: 'Déployer agents et monitorer performance',
    concepts: [
      'Publishing: Draft → Production deployment',
      'Multi-channel Deployment: Web, Teams, Apps',
      'Analytics: Conversation metrics, user satisfaction',
      'Performance Monitoring: Response time, errors',
      'User Feedback: Ratings, sentiment analysis',
      'Continuous Improvement: A/B testing, iterations'

    code: `<!-- Déploiement et Monitoring d'Agents -->
<!-- Gestion Production et Analyses -->

Deployment Pipeline:
Draft Version
  ↓ (Testing)
Staging

Production
  ↓

  ↓

✓ Entities configured
✓ Actions working
✓ Error handling in place
✓ Analytics enabled
✓ Security reviewed
✓ Knowledge base updated
✓ Admin notifications set

Multi-channel Deployment:
- Web: Self-hosted or iframe embed

- SharePoint: Web part embedded
- Custom App: Via Power Apps
- Portal: Customer self-service

Analytics Dashboard Metrics:
{
  "conversation_metrics": {
    "total_conversations": 1250,
    "avg_duration": "3.5 min",
    "resolution_rate": 0.87,
    "escalation_rate": 0.13
  },
  "user_satisfaction": {
    "avg_rating": 4.2,
    "sentiment": "positive",
    "nps": 42
  },
  "performance": {
    "avg_response_time": "0.8s",
    "error_rate": 0.02,
    "availability": 0.999
  },
  "top_topics": [
    {"name": "Leave Requests", "count": 450},
    {"name": "Payroll", "count": 280},
    {"name": "Benefits", "count": 200}
  ]
}

Monitoring & Alerts:
- Response time > 2s: Alert
- Error rate > 5%: Critical
- Escalation > 20%: Review topics
- Negative sentiment: Manual review
- Daily digest: Performance summary

A/B Testing Pattern:
Version A (Current) → 50% traffic
Version B (Improved) → 50% traffic
  ↓ (Measure: resolution rate)
Winner: Promote best performer
  ↓
Rollout: 100% production

Continuous Improvement:
1. Analyze failed conversations
2. Identify gaps/improvements
3. Update topics, actions, prompts
4. Test changes
5. Publish & monitor
6. Measure impact
`,
    takeaway: 'Deployment = planning. Monitoring = visibility. Analytics = insights. Feedback = growth. Continuous iteration = success. NPS & resolution rate = KPIs clés!'
  }
};

let currentModule = 1;
const maxModules = Object.keys(MODULES_DATA).length;

function renderModule(moduleNum) {
  const data = MODULES_DATA[moduleNum];
  if (!data) return;

  document.getElementById('module-title').textContent = data.title;
  document.getElementById('module-desc').textContent = data.desc;
  document.getElementById('breadcrumb-title').textContent = data.title;

  let conceptsHtml = '<ul>';
  data.concepts.forEach(concept => {
    conceptsHtml += `<li>${concept}</li>`;
  });
  conceptsHtml += '</ul>';

  const content = `
    <div class="module">
      <h2 class="module-title">${data.title}</h2>
      <p class="module-desc">${data.desc}</p>

      <div class="concepts-box">
        <strong>Concepts Clés:</strong>
        ${conceptsHtml}
      </div>

      <div class="sandbox-container">
        <div class="sandbox-editor">
          <label class="sandbox-label">Configuration & Architecture</label>
          <div class="editor-container" id="editor-${moduleNum}"></div>
        </div>
      </div>

      <div class="takeaway-box">
        <strong>À retenir:</strong>
        <p>${data.takeaway}</p>
      </div>

      <div class="module-nav">
        <button class="nav-button prev" onclick="previousModule()" ${currentModule === 1 ? 'disabled' : ''}>
          ← Précédent
        </button>
        <div class="nav-progress">
          <span id="progress-text">Module ${currentModule}/${maxModules}</span>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${(currentModule/maxModules)*100}%"></div>
          </div>
        </div>
        <button class="nav-button next" onclick="nextModule()" ${currentModule === maxModules ? 'disabled' : ''}>
          Suivant →
        </button>
      </div>
    </div>
  `;

  document.getElementById('module-content').innerHTML = content;
  initializeEditor(moduleNum, data.code);
}

function initializeEditor(moduleNum, code) {
  setTimeout(() => {
    CodeMirror(document.getElementById(`editor-${moduleNum}`), {
      value: code,
      mode: null,
      theme: 'material-darker',
      readOnly: true,
      lineNumbers: true,
      lineWrapping: true,
      viewportMargin: Infinity
    });
  }, 100);
}

function nextModule() {
  if (currentModule < maxModules) {
    currentModule++;
    renderModule(currentModule);
    window.scrollTo(0, 0);
  }
}

function previousModule() {
  if (currentModule > 1) {
    currentModule--;
    renderModule(currentModule);
    window.scrollTo(0, 0);
  }
}

renderModule(1);
</script>

</body>
