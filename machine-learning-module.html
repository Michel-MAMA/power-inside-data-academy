  1: {
    title: 'Fondamentaux du Machine Learning',

      { bold: 'Supervised Learning:', text: 'Prédire avec données étiquetées (y)' },

      { bold: 'Target (y):', text: 'Variable à prédire (sortie)' },

    code: `# 1. CRÉER DONNÉES SYNTHÉTIQUES
import numpy as np
import pandas as pd

np.random.seed(42)
n_samples = 100

surface = np.random.uniform(50, 200, n_samples)  # m²
prix = 3000 * surface + 50000 + np.random.normal(0, 30000, n_samples)  # €

print(f"Nombre de samples: {n_samples}")
print(f"Surface: min={surface.min():.0f}, max={surface.max():.0f}")
print(f"Prix: min={prix.min():.0f}, max={prix.max():.0f}")

# 2. CRÉER DATAFRAME
df = pd.DataFrame({
    'surface_m2': surface,
    'prix_euros': prix
})
print(df.head(10))
print(f"\\nStatistiques:\\n{df.describe()}")

# 3. TRAIN/TEST SPLIT - 80% entraînement, 20% test
split_idx = int(n_samples * 0.8)
X_train = surface[:split_idx]
X_test = surface[split_idx:]
y_train = prix[:split_idx]
y_test = prix[split_idx:]

print(f"\\n=== TRAIN/TEST SPLIT (80/20) ===")
print(f"Train: {len(X_train)} samples")
print(f"Test: {len(X_test)} samples")

# 4. STATISTIQUES FEATURES
print(f"\\n=== STATISTIQUES ===")
print(f"Surface moyenne train: {X_train.mean():.1f} m²")
print(f"Surface écart-type train: {X_train.std():.1f} m²")
print(f"Prix moyen train: {y_train.mean():.0f} €")
print(f"Prix écart-type train: {y_train.std():.0f} €")

# 5. CORRÉLATION
print(f"\\n=== CORRÉLATION ===")
correlation = np.corrcoef(surface, prix)[0, 1]
print(f"Corrélation surface-prix: {correlation:.4f}")
print(f"(1 = corrélation parfaite, 0 = aucune corrélation)")`,
    takeaway: 'ML = données + algorithme. 80% du temps = préparation données. Features (X) et target (y) essentiels. Train/test split critique pour évaluer correctement. Always check: shape, distributions, nulls, correlations!'
  },
  2: {
    title: 'Régression Linéaire & Prédiction',
    desc: 'Régression simple/multiple, coefficients, R² et résidus',
    concepts: [
      { bold: 'Régression Linéaire:', text: 'y = a₀ + a₁x₁ + a₂x₂ + ...' },
      { bold: 'Coefficients:', text: 'Poids de chaque feature (importance)' },
      { bold: 'Intercept (a₀):', text: 'Valeur quand toutes features = 0' },
      { bold: 'MSE:', text: 'Erreur moyenne au carré (optimisée)' },
      { bold: 'R² Score:', text: '1 = parfait, 0 = mauvais' },
      { bold: 'Overfitting:', text: 'Train score > test score = danger' }
    ],
    code: `# RÉGRESSION LINÉAIRE AVEC NUMPY
import numpy as np

np.random.seed(42)
n = 100
x1 = np.random.randn(n)
x2 = np.random.randn(n)
X = np.column_stack([np.ones(n), x1, x2])
y = 2*x1 + 3*x2 + np.random.randn(n) * 0.5

print(f"Nombre samples: {n}")
print(f"Features: x1, x2 (+ intercept)")

# 2. TRAIN/TEST SPLIT
split = int(n * 0.8)
X_train, X_test = X[:split], X[split:]
y_train, y_test = y[:split], y[split:]

print(f"\\n=== TRAIN/TEST SPLIT ===")
print(f"Train: {len(X_train)}, Test: {len(X_test)}")

# 3. RÉGRESSION LINÉAIRE (moindres carrés)
print(f"\\n=== ENTRAÎNEMENT ===")
beta = np.linalg.lstsq(X_train, y_train, rcond=None)[0]
intercept = beta[0]
coefficients = beta[1:]

print(f"Intercept: {intercept:.4f}")
print(f"Coefficient x1: {coefficients[0]:.4f} (réel: 2)")
print(f"Coefficient x2: {coefficients[1]:.4f} (réel: 3)")

# 4. PRÉDICTIONS
print(f"\\n=== PRÉDICTIONS ===")
y_pred_train = X_train @ beta
y_pred_test = X_test @ beta

print(f"Prédictions train (5 premiers): {y_pred_train[:5].round(3)}")
print(f"Réalité train (5 premiers): {y_train[:5].round(3)}")

# 5. MÉTRIQUES D'ERREUR
print(f"\\n=== MÉTRIQUES ===")

def mse(y_true, y_pred):
    return np.mean((y_true - y_pred) ** 2)

def r2_score(y_true, y_pred):
    ss_res = np.sum((y_true - y_pred) ** 2)
    ss_tot = np.sum((y_true - np.mean(y_true)) ** 2)
    return 1 - (ss_res / ss_tot)

mse_train = mse(y_train, y_pred_train)
mse_test = mse(y_test, y_pred_test)
r2_train = r2_score(y_train, y_pred_train)
r2_test = r2_score(y_test, y_pred_test)

print(f"Train MSE: {mse_train:.4f}, R²: {r2_train:.4f}")
print(f"Test MSE: {mse_test:.4f}, R²: {r2_test:.4f}")

# 6. DÉTECTION OVERFITTING
print(f"\\n=== OVERFITTING? ===")
diff = r2_train - r2_test
if diff > 0.1:
    print(f"⚠️ Possible overfitting! Différence R²: {diff:.4f}")
else:
    print(f"✓ Pas d'overfitting détecté")`,
    takeaway: 'Régression = prédire valeurs continues. MSE optimisée = moindres carrés. R² = 0-1 (1=parfait). Train/test MSE ≈ bon signe. MSE >> sur test = overfitting. Vérifier résidus ≈ 0 (normalement distribués).'
  },
  3: {
    title: 'Classification & Logistic Regression',
    desc: 'Classification binaire/multiclasse, probabilités et seuils',
    concepts: [
      { bold: 'Classification:', text: 'Prédire catégories (0/1, A/B/C)' },
      { bold: 'Logistic Regression:', text: 'Probabilités via sigmoid' },
      { bold: 'Decision Boundary:', text: 'Seuil (par défaut 0.5)' },
      { bold: 'Confusion Matrix:', text: 'TP, TN, FP, FN' },
      { bold: 'Precision/Recall:', text: 'Trade-off des erreurs' },
      { bold: 'F1-Score:', text: 'Moyenne harmonique Precision/Recall' }
    ],
    code: `# CLASSIFICATION SIMPLE AVEC NUMPY
import numpy as np

np.random.seed(42)
n = 100

class0 = np.random.randn(n//2, 2)
y0 = np.zeros(n//2)

class1 = np.random.randn(n//2, 2) + 2
y1 = np.ones(n//2)

X = np.vstack([class0, class1])
y = np.hstack([y0, y1])

print(f"Nombre samples: {n}")
print(f"Classes: {np.unique(y)}")
print(f"Distribution: {np.bincount(y.astype(int))}")

# 2. TRAIN/TEST SPLIT
split = int(n * 0.8)
idx = np.arange(n)
np.random.shuffle(idx)

X_train, X_test = X[idx[:split]], X[idx[split:]]
y_train, y_test = y[idx[:split]], y[idx[split:]]

print(f"\\n=== TRAIN/TEST SPLIT ===")
print(f"Train: {len(X_train)}, Test: {len(X_test)}")

# 3. CLASSIFICATEUR SIMPLE (K-Nearest Neighbors manuel)
print(f"\\n=== CLASSIFICATION KNN (K=3) ===")

def knn_predict(X_train, y_train, X_test, k=3):
    predictions = []
    for x_test in X_test:
        distances = np.sqrt(np.sum((X_train - x_test)**2, axis=1))
        k_nearest_idx = np.argsort(distances)[:k]
        k_nearest_labels = y_train[k_nearest_idx]
        pred = np.bincount(k_nearest_labels.astype(int)).argmax()
        predictions.append(pred)
    return np.array(predictions)

y_pred = knn_predict(X_train, y_train, X_test, k=3)

print(f"Prédictions (5 premiers): {y_pred[:5].astype(int)}")
print(f"Réalité (5 premiers): {y_test[:5].astype(int)}")

# 4. MÉTRIQUES
print(f"\\n=== MÉTRIQUES ===")

accuracy = np.mean(y_pred == y_test)
tp = np.sum((y_pred == 1) & (y_test == 1))
tn = np.sum((y_pred == 0) & (y_test == 0))
fp = np.sum((y_pred == 1) & (y_test == 0))
fn = np.sum((y_pred == 0) & (y_test == 1))

precision = tp / (tp + fp) if (tp + fp) > 0 else 0
recall = tp / (tp + fn) if (tp + fn) > 0 else 0
f1 = 2 * (precision * recall) / (precision + recall) if (precision + recall) > 0 else 0

print(f"Accuracy: {accuracy:.4f}")
print(f"Precision: {precision:.4f}")
print(f"Recall: {recall:.4f}")
print(f"F1-Score: {f1:.4f}")

# 5. CONFUSION MATRIX
print(f"\\n=== CONFUSION MATRIX ===")
print(f"TP (True Positive): {tp}")
print(f"TN (True Negative): {tn}")
print(f"FP (False Positive): {fp}")
print(f"FN (False Negative): {fn}")

# 6. RÉSUMÉ
print(f"\\n=== RÉSUMÉ ===")
correct = tp + tn
total = len(y_test)
print(f"Prédictions correctes: {correct}/{total}")
print(f"Taux de réussite: {accuracy*100:.1f}%")`,
    takeaway: 'Classification = prédire catégories. Logistic regression = probabilités via sigmoid. Seuil défaut = 0.5. Confusion matrix = TP/TN/FP/FN. Precision = fiabilité "positifs", Recall = couverture positifs. F1 = harmonie entre precision/recall.'
  }
};

// Module 4: Clustering
MODULES_DATA[4] = {
  title: 'Apprentissage Non-Supervisé & Clustering',
  desc: 'K-Means, hiérarchique, clustering et détection de patterns',
  concepts: [
    { bold: 'Unsupervised Learning:', text: 'Pas de labels (y), découvrir patterns' },
    { bold: 'Clustering:', text: 'Grouper données similaires' },
    { bold: 'K-Means:', text: 'Partitionner en K clusters' },
    { bold: 'Centroïdes:', text: 'Centre de chaque cluster' },
    { bold: 'Inertia:', text: 'Distance totale points→centroïdes' },
    { bold: 'Silhouette Score:', text: 'Cohésion & séparation clusters' }
  ],
  code: `# K-MEANS CLUSTERING AVEC NUMPY
import numpy as np

np.random.seed(42)
n = 150
k = 3

# 1. CRÉER DONNÉES SYNTHÉTIQUES (3 clusters)
print("=== GÉNÉRATION DONNÉES ===")
cluster1 = np.random.randn(n//3, 2) + [0, 0]
cluster2 = np.random.randn(n//3, 2) + [5, 5]
cluster3 = np.random.randn(n//3, 2) + [10, 0]

X = np.vstack([cluster1, cluster2, cluster3])
np.random.shuffle(X)

print(f"Nombre samples: {n}")
print(f"Nombre features: 2")
print(f"K clusters: {k}")

# 2. K-MEANS MANUEL
print(f"\\n=== K-MEANS ALGORITHM ===")

def kmeans(X, k, max_iter=100):
    # Initialiser centroïdes aléatoirement
    idx = np.random.choice(len(X), k, replace=False)
    centroids = X[idx].copy()

    for iteration in range(max_iter):
        # Assigner chaque point au centroïde le plus proche
        distances = np.sqrt(((X - centroids[:, np.newaxis])**2).sum(axis=2))
        labels = np.argmin(distances, axis=0)

        # Calculer nouveaux centroïdes
        new_centroids = np.array([X[labels == i].mean(axis=0) for i in range(k)])

        # Vérifier convergence
        if np.allclose(centroids, new_centroids):
            print(f"Convergence à l'itération {iteration}")
            break

        centroids = new_centroids

    return labels, centroids

labels, centroids = kmeans(X, k, max_iter=100)

print(f"Cluster assignment done!")

# 3. STATISTIQUES CLUSTERS
print(f"\\n=== STATISTIQUES CLUSTERS ===")
for i in range(k):
    cluster_points = X[labels == i]
    print(f"Cluster {i}: {len(cluster_points)} points")
    print(f"  Centroïde: [{centroids[i][0]:.2f}, {centroids[i][1]:.2f}]")
    print(f"  Centre de masse: [{cluster_points.mean(axis=0)[0]:.2f}, {cluster_points.mean(axis=0)[1]:.2f}]")

# 4. INERTIA (somme distances)
print(f"\\n=== INERTIA (QUALITÉ) ===")
inertia = 0
for i in range(k):
    cluster_points = X[labels == i]
    distances = np.sum((cluster_points - centroids[i])**2, axis=1)
    inertia += distances.sum()

print(f"Inertia totale: {inertia:.2f}")
print(f"(Plus bas = meilleur)")

# 5. SILHOUETTE SCORE
print(f"\\n=== SILHOUETTE SCORE ===")

def silhouette_score(X, labels):
    scores = []
    for i in range(len(X)):
        # a: distance moyenne au centroïde du cluster
        same_cluster = X[labels == labels[i]]
        a = np.mean(np.sqrt(np.sum((same_cluster - X[i])**2, axis=1)))

        # b: distance min au centroïde des autres clusters
        other_clusters = set(np.unique(labels)) - {labels[i]}
        b_values = []
        for cluster in other_clusters:
            other_cluster_points = X[labels == cluster]
            dist = np.mean(np.sqrt(np.sum((other_cluster_points - X[i])**2, axis=1)))
            b_values.append(dist)
        b = min(b_values) if b_values else float('inf')

        # Score = (b - a) / max(a, b)
        score = (b - a) / max(a, b) if max(a, b) > 0 else 0
        scores.append(score)

    return np.mean(scores)

sil_score = silhouette_score(X, labels)
print(f"Silhouette Score: {sil_score:.4f}")
print(f"(Entre -1 et 1, plus proche de 1 = mieux)")

# 6. ÉLBOW METHOD (trouver K optimal)
print(f"\\n=== ÉLBOW METHOD ===")
inertias = []
for k_test in range(1, 6):
    _, _ = kmeans(X, k_test, max_iter=100)
    inertia_test = sum(np.sum((X[labels == i] - centroids[i])**2) for i in range(k_test))
    inertias.append(inertia_test)
    print(f"K={k_test}: Inertia={inertia_test:.2f}")
print(f"(Chercher le 'coude' du graphe)")`
  ,
  takeaway: 'Clustering = regrouper sans labels. K-Means = partitionner en K groupes. Centroïdes = centres clusters. Inertia = qualité (moins = mieux). Silhouette = score cohésion (max=1). Élbow method = trouver K optimal. Ne pas oublier: normaliser features avant clustering!'
};

MODULES_DATA[5] = {
  title: 'Arbres de Décision & Forêts Aléatoires',
  desc: 'Decision Trees, Random Forests, feature importance et ensemble learning',
  concepts: [
    { bold: 'Decision Tree:', text: 'Règles si/sinon récursives' },
    { bold: 'Nœud (Node):', text: 'Division basée sur feature' },
    { bold: 'Feuille (Leaf):', text: 'Prédiction finale' },
    { bold: 'Gini/Entropy:', text: 'Critère de pureté' },

  code: `# DECISION TREE & RANDOM FOREST AVEC NUMPY
import numpy as np

np.random.seed(42)
n = 200

# 1. CRÉER DATASET CLASSIFICATION
print("=== DATASET CLASSIFICATION ===")

# Features: âge, salaire
age = np.random.uniform(20, 60, n)
salary = np.random.uniform(30000, 150000, n)

# Target: achète produit (1) ou non (0) - règle simple
y = ((age > 40) | (salary > 100000)).astype(int)

X = np.column_stack([age, salary])

# Ajouter du bruit
noise_idx = np.random.choice(n, size=int(n*0.1), replace=False)
y[noise_idx] = 1 - y[noise_idx]

print(f"Samples: {n}")
print(f"Features: âge, salaire")
print(f"Classes: {np.unique(y)}")
print(f"Distribution: {np.bincount(y)}")

# 2. TRAIN/TEST SPLIT
print(f"\\n=== TRAIN/TEST SPLIT ===")
split = int(n * 0.8)
X_train, X_test = X[:split], X[split:]
y_train, y_test = y[:split], y[split:]
print(f"Train: {len(X_train)}, Test: {len(X_test)}")

# 3. DECISION TREE SIMPLE (Manual)
print(f"\\n=== DECISION TREE MANUEL ===")

def simple_decision_rule(X, feature_idx, threshold):
    return X[:, feature_idx] > threshold

def evaluate_split(X, y, feature_idx, threshold):
    left_mask = simple_decision_rule(X, feature_idx, threshold)
    right_mask = ~left_mask

    if np.sum(left_mask) == 0 or np.sum(right_mask) == 0:
        return float('inf')

    # Gini impurity
    def gini(y_subset):
        p = np.bincount(y_subset) / len(y_subset)
        return 1 - np.sum(p**2)

    gini_left = gini(y[left_mask])
    gini_right = gini(y[right_mask])
    weighted_gini = (np.sum(left_mask) * gini_left + np.sum(right_mask) * gini_right) / len(y)

    return weighted_gini

# Trouver le meilleur split
best_gini = float('inf')
best_feature, best_threshold = 0, 0

for feature_idx in range(X_train.shape[1]):
    thresholds = np.percentile(X_train[:, feature_idx], [25, 50, 75])
    for threshold in thresholds:
        gini = evaluate_split(X_train, y_train, feature_idx, threshold)
        if gini < best_gini:
            best_gini = gini
            best_feature = feature_idx
            best_threshold = threshold

feature_names = ['Âge', 'Salaire']
print(f"Meilleure division:")
print(f"  Feature: {feature_names[best_feature]}")
print(f"  Threshold: {best_threshold:.0f}")
print(f"  Gini: {best_gini:.4f}")

# 4. PRÉDICTIONS AVEC LA RÈGLE
print(f"\\n=== PRÉDICTIONS (TOP RULE) ===")
y_pred_train = simple_decision_rule(X_train, best_feature, best_threshold).astype(int)
y_pred_test = simple_decision_rule(X_test, best_feature, best_threshold).astype(int)

accuracy_train = np.mean(y_pred_train == y_train)
accuracy_test = np.mean(y_pred_test == y_test)

print(f"Accuracy Train: {accuracy_train:.4f}")
print(f"Accuracy Test: {accuracy_test:.4f}")

# 5. RANDOM FOREST ENSEMBLE (Multiple simple rules)
print(f"\\n=== RANDOM FOREST (5 arbres) ===")

n_trees = 5
predictions = []

for tree_idx in range(n_trees):
    # Bagging: sample avec remplacement
    sample_idx = np.random.choice(len(X_train), len(X_train), replace=True)
    X_sample = X_train[sample_idx]
    y_sample = y_train[sample_idx]

    # Trouver meilleur split pour ce bootstrap sample
    best_gini_tree = float('inf')
    best_feature_tree, best_threshold_tree = 0, 0

    for feature_idx in range(X_sample.shape[1]):
        thresholds = np.percentile(X_sample[:, feature_idx], [25, 50, 75])
        for threshold in thresholds:
            gini = evaluate_split(X_sample, y_sample, feature_idx, threshold)
            if gini < best_gini_tree:
                best_gini_tree = gini
                best_feature_tree = feature_idx
                best_threshold_tree = threshold

    # Prédire
    pred = simple_decision_rule(X_test, best_feature_tree, best_threshold_tree).astype(int)
    predictions.append(pred)

predictions = np.array(predictions)
y_pred_ensemble = np.round(predictions.mean(axis=0)).astype(int)

accuracy_ensemble = np.mean(y_pred_ensemble == y_test)
print(f"Accuracy Ensemble: {accuracy_ensemble:.4f}")

# 6. FEATURE IMPORTANCE
print(f"\\n=== FEATURE IMPORTANCE ===")
feature_usage = {0: 0, 1: 0}

for tree_idx in range(n_trees):
    sample_idx = np.random.choice(len(X_train), len(X_train), replace=True)
    X_sample = X_train[sample_idx]
    y_sample = y_train[sample_idx]

    best_feature_tree = 0
    for feature_idx in range(X_sample.shape[1]):
        thresholds = np.percentile(X_sample[:, feature_idx], [25, 50, 75])
        for threshold in thresholds:
            gini = evaluate_split(X_sample, y_sample, feature_idx, threshold)

    # Note: simplifié - en réalité on accumulerait importance
    feature_usage[best_feature_tree] += 1

for feature_idx in range(len(feature_names)):
    importance = feature_usage[feature_idx] / n_trees
    print(f"{feature_names[feature_idx]}: {importance:.2f}")
print(f"(Somme = 1.0 idéalement)")`

};

MODULES_DATA[6] = {
  title: 'Validation & Optimisation des Modèles',
  desc: 'Cross-validation, hyperparamètres, GridSearchCV et sélection de modèle',
  concepts: [
    { bold: 'K-Fold Cross-Validation:', text: 'Diviser K fois, tester K fois' },
    { bold: 'Hyperparamètres:', text: 'Paramètres à tuner (K, max_depth...)' },
    { bold: 'Grid Search:', text: 'Essayer toutes combinaisons' },
    { bold: 'Train/Val/Test:', text: 'Split 3 voies (60/20/20)' },
    { bold: 'Learning Curves:', text: 'Diagnostiquer bias/variance' },
    { bold: 'Overfitting vs Underfitting:', text: 'Trouver le sweet spot' }

  code: `# VALIDATION & HYPERPARAMETER TUNING AVEC NUMPY
import numpy as np

np.random.seed(42)
n = 300

# 1. CRÉER DATASET AVEC FEATURES POLYNOMIALES
print("=== DATASET POLYNOMIAL ===")

X = np.random.uniform(-5, 5, n).reshape(-1, 1)
y_true = 2 * X**2 + 3 * X + 1 + np.random.normal(0, 5, (n, 1))
y = y_true.ravel()

print(f"Samples: {n}")
print(f"Relation: y = 2x² + 3x + 1 + noise")
print(f"Y range: [{y.min():.1f}, {y.max():.1f}]")

# 2. K-FOLD CROSS-VALIDATION
print(f"\\n=== 5-FOLD CROSS-VALIDATION ===")

def kfold_split(n, k=5):
    fold_size = n // k
    folds = []
    for i in range(k):
        test_idx = np.arange(i * fold_size, (i+1) * fold_size)
        train_idx = np.concatenate([np.arange(0, i*fold_size),
                                    np.arange((i+1)*fold_size, n)])
        folds.append((train_idx, test_idx))
    return folds

def mse(y_true, y_pred):
    return np.mean((y_true - y_pred)**2)

def linear_regression(X_train, y_train, X_test):
    X_train_poly = np.column_stack([np.ones(len(X_train)), X_train, X_train**2])
    X_test_poly = np.column_stack([np.ones(len(X_test)), X_test, X_test**2])
    coef = np.linalg.lstsq(X_train_poly, y_train, rcond=None)[0]
    return X_test_poly @ coef

folds = kfold_split(n, k=5)
fold_scores = []

for fold_idx, (train_idx, test_idx) in enumerate(folds):
    X_train, X_test = X[train_idx], X[test_idx]
    y_train, y_test = y[train_idx], y[test_idx]

    y_pred = linear_regression(X_train, y_train, X_test)
    score = mse(y_test, y_pred)
    fold_scores.append(score)

    print(f"Fold {fold_idx+1}/5: MSE = {score:.4f}")

print(f"\\nMean CV MSE: {np.mean(fold_scores):.4f} ± {np.std(fold_scores):.4f}")

# 3. HYPERPARAMETER TUNING - GRID SEARCH
print(f"\\n=== GRID SEARCH (Regularization) ===")

# Simuler L2 regularization (Ridge)
def ridge_regression(X_train, y_train, X_test, alpha=0.0):
    X_train_poly = np.column_stack([np.ones(len(X_train)), X_train, X_train**2])
    X_test_poly = np.column_stack([np.ones(len(X_test)), X_test, X_test**2])

    # Ajouter regularization
    A = X_train_poly.T @ X_train_poly + alpha * np.eye(X_train_poly.shape[1])
    coef = np.linalg.solve(A, X_train_poly.T @ y_train)
    return X_test_poly @ coef

alphas = [0.0, 0.1, 1.0, 10.0]
best_alpha = None
best_cv_score = float('inf')
grid_results = []

for alpha in alphas:
    cv_scores = []
    for train_idx, test_idx in folds:
        X_train, X_test = X[train_idx], X[test_idx]
        y_train, y_test = y[train_idx], y[test_idx]
        y_pred = ridge_regression(X_train, y_train, X_test, alpha=alpha)
        cv_scores.append(mse(y_test, y_pred))

    mean_cv_score = np.mean(cv_scores)
    grid_results.append((alpha, mean_cv_score))

    print(f"Alpha={alpha}: CV MSE = {mean_cv_score:.4f}")

    if mean_cv_score < best_cv_score:
        best_cv_score = mean_cv_score
        best_alpha = alpha

print(f"\\nMeilleur Alpha: {best_alpha}")

# 4. TRAIN/VAL/TEST SPLIT
print(f"\\n=== TRAIN/VAL/TEST SPLIT ===")

train_size = int(n * 0.6)
val_size = int(n * 0.2)

X_train, X_val, X_test = X[:train_size], X[train_size:train_size+val_size], X[train_size+val_size:]
y_train, y_val, y_test = y[:train_size], y[train_size:train_size+val_size], y[train_size+val_size:]

print(f"Train: {len(X_train)} ({len(X_train)/n*100:.0f}%)")
print(f"Val: {len(X_val)} ({len(X_val)/n*100:.0f}%)")
print(f"Test: {len(X_test)} ({len(X_test)/n*100:.0f}%)")

y_pred_train = ridge_regression(X_train, y_train, X_train, alpha=best_alpha)
y_pred_val = ridge_regression(X_train, y_train, X_val, alpha=best_alpha)
y_pred_test = ridge_regression(X_train, y_train, X_test, alpha=best_alpha)

print(f"\\nMSE Train: {mse(y_train, y_pred_train):.4f}")
print(f"MSE Val: {mse(y_val, y_pred_val):.4f}")
print(f"MSE Test: {mse(y_test, y_pred_test):.4f}")

# 5. LEARNING CURVES
print(f"\\n=== LEARNING CURVES (Bias vs Variance) ===")

training_sizes = np.linspace(0.1, 1.0, 5)
train_scores = []
val_scores = []

for size in training_sizes:
    n_train = int(len(X_train) * size)
    X_temp = X_train[:n_train]
    y_temp = y_train[:n_train]

    y_pred_t = ridge_regression(X_temp, y_temp, X_train, alpha=best_alpha)
    y_pred_v = ridge_regression(X_temp, y_temp, X_val, alpha=best_alpha)

    train_scores.append(mse(y_train, y_pred_t))
    val_scores.append(mse(y_val, y_pred_v))

    print(f"Size {size*100:.0f}%: Train MSE={train_scores[-1]:.4f}, Val MSE={val_scores[-1]:.4f}")

# 6. DIAGNOSTIQUE
print(f"\\n=== DIAGNOSTIQUE ===")
gap = val_scores[-1] - train_scores[-1]

print(f"Train MSE final: {train_scores[-1]:.4f}")
print(f"Val MSE final: {val_scores[-1]:.4f}")
print(f"Gap (Val - Train): {gap:.4f}")

if gap > 0.5:
    print(f"⚠️ OVERFITTING: augmenter regularization ou data")
elif gap < -0.5:
    print(f"⚠️ UNDERFITTING: réduire regularization ou complexité")
else:
    print(f"✓ BON ÉQUILIBRE bias/variance")`
  ,
  takeaway: 'K-Fold CV = évaluation robuste. Hyperparamètres = à tuner (Grid Search). Train/Val/Test = validation 3 voies (60/20/20). Learning curves diagnostiquent bias/variance. Overfitting: Val >> Train. Underfitting: Val ≈ Train mais mauvais. Toujours: normaliser features avant cross-validation!'
};


let pyodide = null;
let pyodideReady = false;
let currentModule = 1;

async function initPyodide() {
  try {
    if (!window.loadPyodide) {
      throw new Error('Pyodide script not loaded');
    }
    pyodide = await window.loadPyodide();
    await pyodide.loadPackage(['numpy', 'pandas']);
    pyodideReady = true;
    console.log('✓ Pyodide loaded');
  } catch (e) {
    console.error('Pyodide error:', e);
    pyodideReady = false;
  }
}

function loadModule(moduleNum) {
  currentModule = moduleNum;
  const data = MODULES_DATA[moduleNum];

  if (!data) {
    document.getElementById('module-content').innerHTML = '<p>Module not found</p>';
    return;
  }

  // Update navigation
  document.getElementById('breadcrumb-title').textContent = `${data.title}`;
  document.getElementById('module-title').textContent = data.title;
  document.getElementById('module-desc').textContent = data.desc;

  // Build concepts box
  let conceptsHtml = '<div class="concepts-box"><strong>📚 Concepts clés:</strong><ul>';
  data.concepts.forEach(c => {
    conceptsHtml += `<li><strong>${c.bold}</strong> ${c.text}</li>`;
  });
  conceptsHtml += '</ul></div>';

  // Build main content
  let contentHtml = `<div class="module">
    ${conceptsHtml}
    <div class="sandbox-container">
      <div class="sandbox-editor">
        <div class="sandbox-label">📝 Code Python</div>
        <textarea id="code-editor" spellcheck="false">${escapeHtml(data.code)}</textarea>
      </div>
      <div>
        <div class="sandbox-label">📤 Résultat</div>
        <div class="sandbox-output" id="output">Cliquez sur "Exécuter"...</div>
        <button class="btn-run" onclick="runCode()">Exécuter</button>
      </div>
    </div>
    <div class="takeaway-box">
      <strong>💡 À Retenir:</strong>
      <p>${data.takeaway}</p>
    </div>
  </div>`;

  // Add navigation
  const prevDisabled = currentModule === 1 ? 'disabled' : '';
  const nextDisabled = currentModule === 6 ? 'disabled' : '';
  const nextText = currentModule === 6 ? 'Fin du cours ✓' : 'Suivant →';

  contentHtml += `<div class="module-nav">
    <button class="nav-button prev" ${prevDisabled} onclick="goToModule(${currentModule - 1})">← Précédent</button>
    <div class="nav-progress">
      <span>${currentModule}/6</span>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${(currentModule / 6) * 100}%"></div>
      </div>
    </div>
    <button class="nav-button" ${nextDisabled} onclick="goToModule(${currentModule + 1})">${nextText}</button>
  </div>`;

  document.getElementById('module-content').innerHTML = contentHtml;

  // Initialize CodeMirror
  setTimeout(() => {
    initCodeMirror();
  }, 100);

  // Scroll to top
  window.scrollTo(0, 0);
}

function initCodeMirror() {
  const textarea = document.getElementById('code-editor');
  if (textarea && !window.editor) {
    window.editor = CodeMirror.fromTextArea(textarea, {
      mode: 'python',
      theme: 'material-darker',
      lineNumbers: true,
      indentUnit: 4,
      lineWrapping: true,
      matchBrackets: true
    });
  }
}

function escapeHtml(text) {
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, m => map[m]);
}

function goToModule(moduleNum) {
  if (moduleNum >= 1 && moduleNum <= 6) {
    loadModule(moduleNum);
  }
}

async function runCode() {
  if (!window.editor) return;

  const code = window.editor.getValue();
  const outputEl = document.getElementById('output');
  const btn = event.target;

  btn.classList.add('loading');
  btn.textContent = 'Chargement...';
  outputEl.innerHTML = '<div style="text-align:center"><div class="loader"></div> <span>Initialisation Python...</span></div>';

  try {
    let attempts = 0;
    while (!pyodideReady && attempts < 360) {
      await new Promise(r => setTimeout(r, 500));
      attempts++;
    }

    if (!pyodideReady) {
      throw new Error('Pyodide failed to load');
    }

    let output = '';
    const originalLog = console.log;
    console.log = function(...args) {
      output += args.join(' ') + '\n';
      originalLog.apply(console, args);
    };

    await pyodide.runPythonAsync(code);
    console.log = originalLog;

    if (output.trim()) {
      outputEl.textContent = output;
      outputEl.classList.remove('error');
      outputEl.classList.add('success');
    } else {
      outputEl.innerHTML = '<span style="color:#999">(Pas de sortie)</span>';
    }
  } catch (err) {
    outputEl.textContent = 'Erreur: ' + err.message;
    outputEl.classList.add('error');
  } finally {
    btn.classList.remove('loading');
    btn.textContent = 'Exécuter';
  }
}

// Get module from URL
function init() {
  const params = new URLSearchParams(window.location.search);
  const moduleNum = parseInt(params.get('m')) || 1;
  loadModule(moduleNum);
  initPyodide();
}

document.addEventListener('DOMContentLoaded', init);
