      <div class="concepts-box">
        <strong>Concepts Clés</strong>

          <li><strong>CALCULATE:</strong> Changer contexte filtre (clé DAX!)</li>
          <li><strong>ALL / ALLEXCEPT:</strong> Ignorer filtres</li>
          <li><strong>Contexte ligne:</strong> Évaluation par ligne (colonnes calculées)</li>
          <li><strong>Contexte filtre:</strong> Évaluation par agrégation (mesures)</li>
          <li><strong>Variables (VAR):</strong> Stocker valeurs intermédiaires</li>
        </ul>
      </div>

      <div class="info-box">
        <strong>⚡ Règle d'Or DAX:</strong> Mesure = CALCULATE + filtre. Colonne = calcul par ligne. Mesure rapide = SUM/COUNT direct.
      </div>

      <div class="code-box">
        <pre><strong>Exemples Mesures DAX</strong>

-- 1. MESURES BASIQUES
Ventes = SUM(Fact_Ventes[Montant])
Nombre_Commandes = COUNT(Fact_Ventes[ID_Vente])
Montant_Moyen = AVERAGE(Fact_Ventes[Montant])

-- 2. POURCENTAGE DU TOTAL
Pct_Total = DIVIDE(
    [Ventes],
    CALCULATE([Ventes], ALL(Dim_Clients))
)

-- 3. ANNÉE SUR ANNÉE (YoY)
Ventes_YoY = CALCULATE(
    [Ventes],
    DATEADD(Dim_Dates[Date], -1, YEAR)
)

Croissance_YoY_Pct = DIVIDE(
    [Ventes] - [Ventes_YoY],
    [Ventes_YoY]
)

-- 4. CUMUL (RUNNING TOTAL)
Ventes_Cumul = CALCULATE(
    [Ventes],
    FILTER(
        ALL(Dim_Dates),
        Dim_Dates[Date] <= MAX(Dim_Dates[Date])
    )
)

-- 5. DISTINCT COUNT
Nb_Clients = DISTINCTCOUNT(Fact_Ventes[FK_Client])</pre>

          <li><strong>Workspace:</strong> Espace collaboratif (Admin, Member, Contributor, Viewer)</li>
          <li><strong>RLS:</strong> Row-Level Security - user sees only their data</li>
          <li><strong>Refresh:</strong> Programmé (toutes les heures, quotidien, etc.)</li>
          <li><strong>Gateway:</strong> Accès données on-premises</li>
          <li><strong>Partage:</strong> Direct user, Group, App</li>
        </ul>
      </div>

      <div class="info-box">
        <strong>🔒 Sécurité Recommandée:</strong> RLS + Refresh automatique + Gateway + Audit logging
      </div>

      <div class="code-box">
        <pre><strong>Processus Publication & Sécurité</strong>

ÉTAPE 1: PUBLIER DEPUIS DESKTOP
- Fichier → Publier
- Sélectionner Workspace destination
- Rapport uploadé au Service

ÉTAPE 2: CRÉER WORKSPACE (Si nouveau projet)
- Power BI Service → Créer Workspace
- Ajouter membres avec rôles:
  * Admin: Tout gérer (edit, publish, delete)
  * Member: Publier, éditer, partager
  * Contributor: Editer, consommer rapports
  * Viewer: Lecture seule

ÉTAPE 3: CONFIGURER RLS (SÉCURITÉ LIGNE)
Scénario: Vendeurs = voient que leurs ventes

Dans Power BI Desktop:
- Onglet Modélisation → Manager Roles
- Créer rôle "Vendeur"
- Règle DAX:
  [Vendeur] = USERNAME()
- Sauvegarder & Publier

En Service:
- Onglet Sécurité → Configurer RLS
- Tester roles (prévisualiser données)

ÉTAPE 4: CONFIGURER REFRESH
- Dataset → Paramètres
- Refresh programmé (ex: 08:00 quotidien)
- Si données on-premises:
  * Installer Gateway
  * Configurer source de données
  * Activer refresh

ÉTAPE 5: PARTAGER
Option A - Direct:
  - Bouton Partager
  - Ajouter users email
  - Ils reçoivent lien

Option B - App (recommandé):
  - Créer App depuis Workspace
  - Curated list rapports
  - Distribuer URL à équipe
  - Updates auto

ÉTAPE 6: MONITORING
- Usage Analytics: Qui accède, quand
- Performance: Query slow?
- Premium Capacity: Si > 10 users</pre>
      </div>

      <div class="takeaway-box">
        <strong>À Retenir</strong>
        <p>Service = collaboration + partage. RLS = sécurité au niveau données. Refresh = automation crítica. Gateway = on-premises connectors. Apps > sharing direct (scalable). Audit logs = compliance. Capacity planning = si croissance users.</p>
      </div>
    </div>`
  }
};

document.addEventListener('DOMContentLoaded', function() {
  const params = new URLSearchParams(window.location.search);
  const moduleNum = parseInt(params.get('m')) || 1;

  if (!MODULES_DATA[moduleNum]) {
    document.getElementById('module-content').innerHTML = '<p style="text-align:center;color:red;">Module non trouvé</p>';
    return;
  }

  const module = MODULES_DATA[moduleNum];
  document.title = `${module.title} - Power BI | Power Inside Data Academy`;
  document.getElementById('module-title').textContent = module.title;
  document.getElementById('module-desc').textContent = module.desc;
  document.getElementById('breadcrumb-title').textContent = module.title;
  document.getElementById('module-content').innerHTML = module.content;

  // Navigation
  const totalModules = Object.keys(MODULES_DATA).length;
  const prevBtn = document.querySelector('.module-nav .nav-button.prev');
  const nextBtn = document.querySelector('.module-nav:not(.prev) .nav-button:not(.prev)');

  let navHTML = `<div class="nav-progress">
    <span>Module ${moduleNum} / ${totalModules}</span>
    <div class="progress-bar"><div class="progress-fill" style="width:${(moduleNum/totalModules)*100}%"></div></div>
  </div>`;

  if (moduleNum > 1) {
    navHTML += `<a href="powerbi-module.html?m=${moduleNum-1}" class="nav-button prev">← Précédent</a>`;
  } else {
    navHTML += `<button class="nav-button" disabled>← Précédent</button>`;
  }

  if (moduleNum < totalModules) {
    navHTML += `<a href="powerbi-module.html?m=${moduleNum+1}" class="nav-button">Suivant →</a>`;
  } else {
    navHTML += `<button class="nav-button" disabled>Suivant →</button>`;
  }

  const moduleDiv = document.querySelector('.module');
  if (moduleDiv) {
    moduleDiv.innerHTML += `<div class="module-nav">${navHTML}</div>`;
  }
});
</script>
