nombres = [1, 2, 3, 4, 5]

print("=== 1. HÉRITAGE ===")

class Animal:

class Compte:
    def __init__(self, solde_initial):
        self._solde = solde_initial  # Privé (convention: _)

    @property
    def solde(self):

    def deposer(self, montant):

def convertir_nombre(valeur):
    try:

print(convertir_nombre("42"))

class AgeInvalideError(Exception):
    pass

def valider_age(age):
    if age < 0 or age > 150:
        raise AgeInvalideError(f"L'âge {age} est invalide (0-150)")
    return f"Âge valide: {age} ans"

try:
    print(valider_age(25))
    print(valider_age(-5))
except AgeInvalideError as e:

# 4. TRY-EXCEPT-ELSE-FINALLY
print(f"\\n=== 4. TRY-EXCEPT-ELSE-FINALLY ===")

def division_securisee(a, b):
    try:
        if not isinstance(a, (int, float)):
            raise TypeError("Le dividende doit être un nombre")
        if b == 0:
            raise ZeroDivisionError("Division par zéro")

    code: `# 1. DÉCORATEURS SIMPLES
print("=== 1. DÉCORATEURS SIMPLES ===")

def mon_decorateur(func):
    def wrapper(*args, **kwargs):
        print(f"Avant appel de {func.__name__}")
        resultat = func(*args, **kwargs)
        print(f"Après appel de {func.__name__}")
        return resultat
    return wrapper

@mon_decorateur
def saluer(nom):
    print(f"Bonjour {nom}!")
    return f"Salutation à {nom}"

saluer("Alice")

# 2. DÉCORATEURS PARAMÉTRÉS
print(f"\\n=== 2. DÉCORATEURS PARAMÉTRÉS ===")

def repeteur(n):
    def decorateur(func):
        def wrapper(*args, **kwargs):
            for i in range(n):
                print(f"Itération {i+1}:")
                func(*args, **kwargs)
        return wrapper
    return decorateur

@repeteur(3)
def crier(message):
    print(f"  {message}!")

crier("HELLO")

# 3. TIMING DECORATOR
print(f"\\n=== 3. TIMING DECORATOR ===")

import time

def timer(func):
    def wrapper(*args, **kwargs):
        debut = time.time()
        resultat = func(*args, **kwargs)
        fin = time.time()
        print(f"{func.__name__} pris {fin-debut:.4f}s")
        return resultat
    return wrapper

@timer
def operation_lente():
    time.sleep(0.1)
    return "Done"

operation_lente()

from functools import wraps

def decorateur_preserve(func):
    @wraps(func)
    def wrapper(*args, **kwargs):
        return func(*args, **kwargs)
    return wrapper

// Get module from URL

const MAX_MODULES = 10;

  document.getElementById('module-content').innerHTML = '<p style="color: red;">Module non trouvé</p>';

  document.getElementById('breadcrumb-title').textContent = `Module ${moduleId}`;

  document.getElementById('module-title').textContent = module.title;
  document.getElementById('module-desc').textContent = module.desc;

  document.getElementById('module-content').innerHTML = html;

  // Navigation
  const navHtml = `<div class="module-nav">

  document.getElementById('module-content').innerHTML += navHtml;
}

function goModule(id) {
  if (id >= 1 && id <= MAX_MODULES) {
    window.location.href = `python-module.html?m=${id}`;
  }
}

// Pyodide setup
let pyodide;
async function runCode() {
  const btn = document.getElementById('btn-run');
  const output = document.getElementById('output');
  const code = document.getElementById('editor-code').value;

  btn.classList.add('loading');
  output.textContent = 'Exécution...';

  try {
    if (!pyodide) {
      pyodide = await loadPyodide();
    }

    // Capture stdout
    let result = '';
    pyodide.globals.set('_output', '');

    pyodide.runPython(`
import sys
from io import StringIO
old_stdout = sys.stdout
sys.stdout = StringIO()
`);

    pyodide.runPython(code);

    result = pyodide.runPython(`sys.stdout.getvalue()`);

    output.textContent = result || '(pas de résultat)';
    output.classList.add('success');
  } catch (error) {
    output.textContent = `Erreur: ${error.message}`;
    output.classList.add('error');
  } finally {
    btn.classList.remove('loading');
  }
}
