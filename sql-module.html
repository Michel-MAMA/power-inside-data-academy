<script>
// Module content - All 12 modules (6 Advanced + 6 Fundamentals)
const MODULES_DATA = {
  1: {
    title: 'SELECT Avancé & Filtrage',
    desc: 'WHERE, LIKE, IN, BETWEEN et conditions complexes',
    concepts: [
      'WHERE: Filtrer les lignes selon une condition',
      'LIKE: Recherche par motif (%, _)',
      'IN: Vérifier si valeur est dans une liste',
      'BETWEEN: Vérifier si valeur est dans une plage',
      'AND/OR: Combiner plusieurs conditions',
      'ORDER BY: Trier les résultats (ASC ou DESC)'
    ],
    code: `-- 1. BASIC SELECT - Sélectionner des colonnes
SELECT nom, departement, salaire FROM employes LIMIT 3;

-- 2. WHERE - Filtrer par condition
-- Employés avec salaire > 50000
SELECT nom, departement, salaire
FROM employes
WHERE salaire > 50000
ORDER BY salaire DESC;

-- 3. BETWEEN - Plage de valeurs
SELECT nom, departement, salaire
FROM employes
WHERE salaire BETWEEN 40000 AND 60000
ORDER BY salaire DESC;

-- 4. IN - Valeurs dans une liste
SELECT nom, departement, salaire
FROM employes
WHERE departement IN ('IT', 'Finance')
ORDER BY nom;

-- 5. LIKE - Recherche par motif
SELECT nom, departement
FROM employes
WHERE nom LIKE 'A%'
ORDER BY nom;

-- 6. AND/OR - Conditions combinées
SELECT nom, departement, salaire
FROM employes
WHERE (departement = 'IT' AND salaire > 45000)
   OR (departement = 'Finance' AND salaire > 55000)
ORDER BY departement, salaire DESC;`,
    takeaway: 'WHERE = clé pour filtrer. BETWEEN pour plages, IN pour listes, LIKE pour motifs. Combinez avec AND/OR pour logique complexe. ORDER BY organise résultats (ASC défaut).'
  },

  2: {
    title: 'Jointures Avancées',
    desc: 'INNER, LEFT, RIGHT, FULL OUTER JOIN et multiples',
    concepts: [
      'INNER JOIN: Seulement les lignes correspondantes',
      'LEFT JOIN: Toutes les lignes gauche + correspondances',
      'RIGHT JOIN: Toutes les lignes droite + correspondances',
      'FULL OUTER JOIN: Toutes les lignes des deux tables',
      'ON clause: Condition pour matcher les tables',
      'Aliasing: Raccourcir les noms (e.nom = employes.nom)'
    ],
    code: `-- 1. INNER JOIN - Intersection
SELECT e.nom, d.nom_dept, e.salaire
FROM employes e
INNER JOIN departements d ON e.dept_id = d.id
ORDER BY e.salaire DESC;

-- 2. LEFT JOIN - Tous de la gauche
SELECT e.nom, COALESCE(d.nom_dept, 'N/A') AS departement, e.salaire
FROM employes e
LEFT JOIN departements d ON e.dept_id = d.id
WHERE e.salaire > 40000
ORDER BY e.salaire DESC;

-- 3. JOINTURE MULTIPLE
SELECT e.nom, d.nom_dept, e.salaire
FROM employes e
LEFT JOIN departements d ON e.dept_id = d.id
ORDER BY d.nom_dept, e.nom;

-- 4. AUTO-JOIN - Joindre une table avec elle-même
SELECT emp.nom AS employe,
       CASE WHEN mgr.nom IS NULL THEN 'Manager' ELSE mgr.nom END AS manager
FROM employes emp
LEFT JOIN employes mgr ON emp.manager_id = mgr.id
ORDER BY emp.nom;`,
    takeaway: 'JOINs combinent données. INNER = strictement deux. LEFT/RIGHT = tout d\'un côté + correspondances. Utilisez alias pour clarifier. ON = condition match.'
  },

  3: {
    title: 'GROUP BY & Agrégations',
    desc: 'COUNT, SUM, AVG, MIN, MAX, HAVING et statistiques',
    concepts: [
      'COUNT(*): Compte les lignes',
      'SUM: Somme des valeurs',
      'AVG: Moyenne',
      'MIN/MAX: Minimum et maximum',
      'GROUP BY: Regrouper par colonne',
      'HAVING: Filtrer les groupes'
    ],
    code: `-- 1. COUNT - Compter
SELECT COUNT(*) AS total_employes FROM employes;

-- 2. SUM, AVG, MIN, MAX - Statistiques
SELECT COUNT(*) AS nb, SUM(salaire) AS total,
       ROUND(AVG(salaire), 2) AS moyenne,
       MIN(salaire) AS minimum, MAX(salaire) AS maximum
FROM employes;

-- 3. GROUP BY - Regrouper et agréger
SELECT departement, COUNT(*) AS nb_employes,
       ROUND(AVG(salaire), 2) AS salaire_moyen,
       MIN(salaire) AS min, MAX(salaire) AS max,
       SUM(salaire) AS masse_salariale
FROM employes
GROUP BY departement
ORDER BY masse_salariale DESC;

-- 4. HAVING - Filtrer les groupes
SELECT departement, COUNT(*) AS nb_employes,
       ROUND(AVG(salaire), 2) AS salaire_moyen
FROM employes
GROUP BY departement
HAVING COUNT(*) >= 2 AND AVG(salaire) > 50000
ORDER BY salaire_moyen DESC;`,
    takeaway: 'GROUP BY agrège par catégories. Classique: GROUP BY + COUNT/SUM/AVG. HAVING = WHERE pour groupes. Toujours inclure non-agrégées dans GROUP BY!'
  },

  4: {
    title: 'Sous-requêtes & CTE',
    desc: 'WITH, sous-requêtes imbriquées et CTE récursives',
    concepts: [
      'CTE (WITH): Common Table Expression réutilisable',
      'Sous-requête: Requête imbriquée dans SELECT/WHERE/FROM',
      'Avantage CTE: Plus lisible que sous-requêtes imbriquées',
      'Récursif: Hiérarchies (organigrammes)',
      'Readabilité: Diviser en étapes logiques',
      'Réutilisabilité: CTE réutilisable plusieurs fois'
    ],
    code: `-- 1. CTE SIMPLE
WITH salaire_moyen_dept AS (
    SELECT departement, ROUND(AVG(salaire), 2) AS salaire_moyen
    FROM employes
    GROUP BY departement
)
SELECT e.nom, e.departement, e.salaire, smd.salaire_moyen,
       ROUND(e.salaire - smd.salaire_moyen, 2) AS ecart
FROM employes e
JOIN salaire_moyen_dept smd ON e.departement = smd.departement
ORDER BY e.departement, ecart DESC;

-- 2. MULTIPLE CTE
WITH avg_salaire AS (
    SELECT departement, ROUND(AVG(salaire), 2) AS avg_sal
    FROM employes GROUP BY departement
),
effectifs AS (
    SELECT departement, COUNT(*) AS effectif
    FROM employes GROUP BY departement
)
SELECT a.departement, e.effectif, a.avg_sal
FROM avg_salaire a
JOIN effectifs e ON a.departement = e.departement
ORDER BY a.avg_sal DESC;

-- 3. SOUS-REQUÊTE dans WHERE
SELECT nom, departement, salaire
FROM employes
WHERE salaire > (SELECT AVG(salaire) FROM employes)
ORDER BY salaire DESC;

-- 4. SOUS-REQUÊTE dans FROM
SELECT dept_name, ROUND(avg_sal, 0) AS rounded
FROM (SELECT departement AS dept_name, AVG(salaire) AS avg_sal
      FROM employes GROUP BY departement) AS dept_stats
ORDER BY avg_sal DESC;`,
    takeaway: 'CTE rend requêtes complexes lisibles. Divisez en étapes. Sous-requête utile pour filtrer (WHERE) ou transformer (FROM). Pattern: CTE calculée une fois, réutilisée.'
  },

  5: {
    title: 'Window Functions',
    desc: 'ROW_NUMBER, RANK, LAG, LEAD et analyses temporelles',
    concepts: [
      'Window Functions: Opérations sur partitions',
      'PARTITION BY: Diviser fenêtre par catégories',
      'ORDER BY: Trier dans la fenêtre',
      'ROW_NUMBER: Numérotation séquentielle (1,2,3)',
      'RANK/DENSE_RANK: Classement avec/sans lacunes',
      'SUM/AVG OVER: Agrégations sans grouper'
    ],
    code: `-- 1. ROW_NUMBER - Numérotation
SELECT nom, departement, salaire,
       ROW_NUMBER() OVER (PARTITION BY departement ORDER BY salaire DESC) AS rang
FROM employes
ORDER BY departement, rang;

-- 2. RANK vs DENSE_RANK
SELECT nom, departement, salaire,
       RANK() OVER (PARTITION BY departement ORDER BY salaire DESC) AS rank,
       DENSE_RANK() OVER (PARTITION BY departement ORDER BY salaire DESC) AS dense_rank
FROM employes
ORDER BY departement, rank;

-- 3. LAG et LEAD - Valeurs précédentes/suivantes
SELECT nom, departement, salaire,
       LAG(salaire) OVER (PARTITION BY departement ORDER BY salaire) AS salaire_prev,
       LEAD(salaire) OVER (PARTITION BY departement ORDER BY salaire) AS salaire_next
FROM employes
ORDER BY departement, salaire;

-- 4. SUM/AVG OVER - Agrégations sans GROUP BY
SELECT nom, departement, salaire,
       SUM(salaire) OVER (PARTITION BY departement) AS total_dept,
       ROUND(AVG(salaire) OVER (PARTITION BY departement), 2) AS moy_dept
FROM employes
ORDER BY departement, nom;`,
    takeaway: 'Window functions = puissantes pour analyses. PARTITION BY divise, ORDER BY trie fenêtre. ROW_NUMBER/RANK pour classement. LAG/LEAD pour séries. Essentiel pour top-N queries!'
  },

  6: {
    title: 'UNION & EXCEPT',
    desc: 'Combiner et comparer ensembles de résultats',
    concepts: [
      'UNION: Combiner résultats (sans doublons)',
      'UNION ALL: Combiner avec doublons',
      'INTERSECT: Valeurs communes',
      'EXCEPT: Différence entre ensembles',
      'Mêmes colonnes: Requis pour combiner',
      'Ordre des résultats: ORDER BY après UNION'
    ],
    code: `-- 1. UNION - Combiner sans doublons
SELECT nom, departement FROM employes WHERE salaire > 50000
UNION
SELECT nom, departement FROM employes WHERE departement = 'IT'
ORDER BY nom;

-- 2. UNION ALL - Avec doublons
SELECT nom, 'Haut salaire' AS categorie FROM employes WHERE salaire > 60000
UNION ALL
SELECT nom, 'IT' AS categorie FROM employes WHERE departement = 'IT'
ORDER BY nom;

-- 3. INTERSECT - Valeurs dans les deux requêtes
SELECT nom FROM employes WHERE salaire > 50000
INTERSECT
SELECT nom FROM employes WHERE departement = 'IT'
ORDER BY nom;

-- 4. EXCEPT - Différence
SELECT nom FROM employes WHERE salaire > 50000
EXCEPT
SELECT nom FROM employes WHERE departement = 'Finance'
ORDER BY nom;`,
    takeaway: 'UNION combine résultats sans doublons. UNION ALL inclut doublons. INTERSECT = common, EXCEPT = difference. Mêmes colonnes requises. ORDER BY après combiner.'
  },

  7: {
    title: 'INSERT, UPDATE, DELETE',
    desc: 'Ajouter, modifier et supprimer données',
    concepts: [
      'INSERT: Ajouter nouvelles lignes',
      'INSERT ... SELECT: Copier données',
      'UPDATE: Modifier données existantes',
      'WHERE: Filtrer pour UPDATE/DELETE (CRUCIAL!)',
      'DELETE: Supprimer lignes',
      'TRUNCATE: Supprimer tout (plus rapide)'
    ],
    code: `-- 1. INSERT - Ajouter une ligne
INSERT INTO employes (nom, departement, salaire)
VALUES ('Marie', 'Marketing', 45000);

-- 2. INSERT multiple
INSERT INTO employes (nom, departement, salaire)
VALUES
  ('Jean', 'IT', 55000),
  ('Sophie', 'Finance', 50000),
  ('Thomas', 'IT', 48000);

-- 3. INSERT ... SELECT
INSERT INTO employes_archive
SELECT * FROM employes WHERE salaire < 40000;

-- 4. UPDATE - Modifier des données
UPDATE employes
SET salaire = salaire * 1.10
WHERE departement = 'IT';

-- 5. UPDATE avec condition
UPDATE employes
SET departement = 'Senior IT'
WHERE departement = 'IT' AND salaire > 50000;

-- 6. DELETE - Supprimer lignes
DELETE FROM employes
WHERE salaire < 30000;

-- 7. DELETE avec condition complexe
DELETE FROM employes
WHERE departement = 'Marketing' AND nom LIKE 'J%';`,
    takeaway: 'INSERT ajoute, UPDATE modifie, DELETE supprime. ALWAYS use WHERE pour UPDATE/DELETE (sinon tous!). INSERT SELECT copie données. Transactions essentielles pour sécurité.'
  },

  8: {
    title: 'DISTINCT & Expressions',
    desc: 'Valeurs uniques, calculs et alias',
    concepts: [
      'DISTINCT: Valeurs uniques seulement',
      'Expressions: Calculs dans SELECT',
      'Alias (AS): Renommer colonnes',
      'Opérateurs: +, -, *, / dans SELECT',
      'CASE: Logique conditionnelle',
      'Fonctions scalaires: UPPER, LOWER, ROUND'
    ],
    code: `-- 1. DISTINCT - Valeurs uniques
SELECT DISTINCT departement FROM employes
ORDER BY departement;

-- 2. DISTINCT sur plusieurs colonnes
SELECT DISTINCT departement, salaire
FROM employes
ORDER BY departement, salaire;

-- 3. Expressions - Calculs
SELECT nom, salaire,
       salaire * 1.10 AS salaire_augmente,
       salaire * 0.2 AS bonus_20pct
FROM employes
ORDER BY salaire DESC;

-- 4. Alias (AS)
SELECT nom AS employee_name,
       departement AS dept,
       salaire * 12 AS salaire_annuel
FROM employes;

-- 5. Fonctions scalaires
SELECT nom,
       UPPER(nom) AS nom_majuscule,
       LOWER(departement) AS dept_minuscule,
       LENGTH(nom) AS longueur_nom,
       ROUND(salaire, -3) AS salaire_arrondi
FROM employes;

-- 6. Expressions complexes
SELECT nom,
       salaire,
       ROUND(salaire / 1000, 1) AS k_euros,
       salaire * 12 * 0.42 AS impot_estime
FROM employes
WHERE salaire > 50000
ORDER BY salaire DESC;`,
    takeaway: 'DISTINCT supprime doublons. Expressions = calculs dans SELECT. Alias clarifie colonnes. Fonctions scalaires transform données. Formules simples = puissantes!'
  },

  9: {
    title: 'CASE & Fonctions',
    desc: 'CASE expressions, COALESCE et fonctions scalaires',

// Initialize SQL.js and create database
let db;
async function initSQL() {
  const sqlJs = await initSqlJs();
  db = new sqlJs.Database();

  // Create sample tables
  db.run(`
    CREATE TABLE employes (
      id INTEGER PRIMARY KEY,
      nom TEXT,
      departement TEXT,
      salaire REAL,
      dept_id INTEGER,
      manager_id INTEGER
    );

    CREATE TABLE departements (
      id INTEGER PRIMARY KEY,
      nom_dept TEXT
    );
  `);

  // Insert sample data
  db.run(`
    INSERT INTO departements VALUES (1, 'IT'), (2, 'Finance'), (3, 'Marketing');

    INSERT INTO employes VALUES
      (1, 'Alice', 'IT', 55000, 1, NULL),
      (2, 'Bob', 'Finance', 50000, 2, NULL),
      (3, 'Charlie', 'IT', 45000, 1, 1),
      (4, 'Diana', 'Marketing', 42000, 3, NULL),
      (5, 'Eve', 'Finance', 48000, 2, 2),
      (6, 'Frank', 'IT', 52000, 1, 1),
      (7, 'Grace', 'Marketing', 46000, 3, 4),
      (8, 'Henry', 'Finance', 55000, 2, 2);
  `);
}

// Get module from URL
const urlParams = new URLSearchParams(window.location.search);
const moduleId = parseInt(urlParams.get('m')) || 1;
const MAX_MODULES = 12;

if (!MODULES_DATA[moduleId]) {
  document.getElementById('module-content').innerHTML = '<p style="color: red;">Module non trouvé</p>';
} else {
  const module = MODULES_DATA[moduleId];

  // Update breadcrumb
  document.getElementById('breadcrumb-title').textContent = `Module ${moduleId}`;

  // Update hero
  document.getElementById('module-title').textContent = module.title;
  document.getElementById('module-desc').textContent = module.desc;

  // Generate content
  let html = `<div class="module">
    <div class="module-title">Module ${moduleId}: ${module.title}</div>
    <div class="module-desc">${module.desc}</div>

    <div class="concepts-box">
      <strong>📚 Concepts clés:</strong>
      <ul>`;

  module.concepts.forEach(concept => {
    html += `<li>${concept}</li>`;
  });

  html += `</ul></div>

    <div class="sandbox-container">
      <div class="sandbox-editor">
        <div class="sandbox-label">📝 Requête SQL</div>
        <textarea id="editor-code" spellcheck="false">${module.code}</textarea>
      </div>
      <div>
        <div class="sandbox-label">📤 Résultat</div>
        <div class="sandbox-output" id="output">Cliquez sur "Exécuter"...</div>
        <button class="btn-run" id="btn-run" onclick="runSQL()">Exécuter</button>
      </div>
    </div>

    <div class="takeaway-box">
      <strong>💡 À Retenir:</strong>
      <p>${module.takeaway}</p>
    </div>
  </div>`;

  document.getElementById('module-content').innerHTML = html;

  // Navigation
  const navHtml = `<div class="module-nav">
    <button class="nav-button" onclick="goModule(${moduleId - 1})" ${moduleId === 1 ? 'disabled' : ''}>
      ← Précédent
    </button>
    <div class="nav-progress">
      <span>Module ${moduleId}/${MAX_MODULES}</span>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${(moduleId / MAX_MODULES) * 100}%"></div>
      </div>
    </div>
    <button class="nav-button" onclick="goModule(${moduleId + 1})" ${moduleId === MAX_MODULES ? 'disabled' : ''}>
      Suivant →
    </button>
  </div>`;

  document.getElementById('module-content').innerHTML += navHtml;
}

function goModule(id) {
  if (id >= 1 && id <= MAX_MODULES) {
    window.location.href = `sql-module.html?m=${id}`;
  }
}

// Run SQL
async function runSQL() {
  const btn = document.getElementById('btn-run');
  const output = document.getElementById('output');
  const code = document.getElementById('editor-code').value;

  btn.classList.add('loading');
  output.textContent = 'Exécution...';

  try {
    if (!db) await initSQL();

    const results = db.exec(code);

    if (results.length === 0) {
      output.innerHTML = '<p style="color: #999;">(pas de résultat)</p>';
    } else {
      let html = '';
      results.forEach(result => {
        html += '<table class="output-table"><thead><tr>';
        result.columns.forEach(col => {
          html += `<th>${col}</th>`;
        });
        html += '</tr></thead><tbody>';
        result.values.forEach(row => {
          html += '<tr>';
          row.forEach(val => {
            html += `<td>${val === null ? 'NULL' : val}</td>`;
          });
          html += '</tr>';
        });
        html += '</tbody></table><br>';
      });
      output.innerHTML = html;
    }
  } catch (error) {
    output.innerHTML = `<p style="color: var(--red);">Erreur: ${error.message}</p>`;
  } finally {
    btn.classList.remove('loading');
  }
}

// Init SQL
initSQL();
</script>
